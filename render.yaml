services:
  # ---- Production ----
  # Auto-deploys on every push to `main`. Merging a PR to main = deploying to prod.
  - type: web
    name: wmmc
    runtime: node
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: wmmc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Raise the V8 heap ceiling: db.json is fully parsed per request and fully re-serialized
      # per write, and the default limit (~256 MB on a 512 MB instance) caused the 2026-07-06
      # OOM crash loop (exit 134) once the season's daily rows grew large enough.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: LOGIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/db.json
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_SCOREBOARD_WEBHOOK_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # OAuth 2.0 Web client ID from Google Cloud — enables "Sign in with Google".
      # Not a secret, but set per-service so prod/staging can differ.
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ---- Staging ----
  # A throwaway copy for verifying a real deploy before it reaches production.
  # Auto-deploys on every push to the `staging` branch. Deliberately isolated
  # from production so testing here can never touch live league data or Slack:
  #   * No persistent disk — the filesystem is ephemeral and reseeds from
  #     managers_seed.json on each deploy. (Render disks also need a paid plan.)
  #   * No DB_PATH — falls back to the in-repo ./db.json (ephemeral, fine here).
  #   * No UPSTASH_* — so staging never mirrors writes to prod's `wmmc_db` Redis
  #     key and clobbers the production backup.
  #   * No SLACK_* — so test activity never posts to the real league channels.
  # Set LOGIN_PASSWORD separately in the staging service's dashboard.
  - type: web
    name: wmmc-staging
    runtime: node
    branch: staging
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Same heap-ceiling bump as production (see the prod NODE_OPTIONS note).
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: LOGIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
