services:
  - type: web
    name: wmmc
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: wmmc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOGIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/db.json
