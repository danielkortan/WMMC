name: CI

# Runs the project's "definition of done" (tests, lint, formatting) on every PR
# and on pushes to main. Mirrors the local pre-commit checks from CLAUDE.md:
#   npm test && npm run lint && npm run format:check
# Keep this in sync with those commands if they change.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18 # matches refresh-db-fixture.yml / Node 18+ in CLAUDE.md
          cache: npm

      - run: npm install

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
