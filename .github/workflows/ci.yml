name: CI

# Runs the project's "definition of done" (tests, lint, formatting) on every PR
# and on pushes to main/staging. Mirrors the local pre-commit checks from CLAUDE.md:
#   npm test && npm run lint && npm run format:check
# Keep this in sync with those commands if they change.
# Pushes to staging are included so Render's "After CI Checks Pass" gate has a
# check to wait on before deploying the staging service.

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # required: js/ tests are ESM in a CJS package, which only runs on Node 22's module syntax detection
          cache: npm

      - run: npm install

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
